apiVersion: 1

apps:
  - type: 'grafana-llm-app'
    disabled: false
    jsonData:
      provider: anthropic
      # Sin esto, el plugin queda instalado y "configurado" pero las funciones de LLM
      # quedan apagadas sin ningun error visible (schema verificado a mano, ver
      # specs/002-grafana-llm-diagnostico/research.md, T001 — no esta documentado asi en
      # ninguna fuente oficial revisada).
      disabled: false
      anthropic:
        url: https://api.anthropic.com
      # El plugin v1.0.8 trae hardcodeado "claude-4-sonnet-20250514" como default para
      # Anthropic (Base y Large) — ese modelo ya no existe en la API real (404
      # not_found_error, verificado 2026-09-01 via /api/plugins/grafana-llm-app/health).
      # Se pisa explicitamente con modelos vigentes (mismo criterio que MODEL en .env de
      # src/, D8: Haiku para lo barato/rapido, Sonnet para lo que necesite mas calidad).
      models:
        default: large
        mapping:
          base: claude-haiku-4-5-20251001
          large: claude-sonnet-5
    secureJsonData:
      # Mismo valor que ya usa src/ via .env — no se duplica el secreto en texto plano,
      # Grafana lo sustituye y lo cifra en su propio secret store (ver riesgo nuevo en
      # memory/risks.md: la key queda materializada en dos lugares).
      anthropicKey: ${ANTHROPIC_API_KEY}
