services:
  broker:
    image: eclipse-mosquitto:2
    container_name: aiproject-broker
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
      - iot-net

  influxdb:
    image: influxdb:2
    container_name: aiproject-influxdb
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_ADMIN_PASSWORD:-changeme123}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG:-aiproject}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET:-lecturas_motor}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN}
    volumes:
      - influxdb-data:/var/lib/influxdb2
    networks:
      - iot-net

  servicio:
    build: .
    container_name: aiproject-servicio
    depends_on:
      - broker
      - influxdb
    env_file:
      - .env
    environment:
      # dentro de la red de docker, el broker y InfluxDB no son "localhost" (valor por
      # defecto de .env, pensado para correr src/main.py fuera de Docker)
      MQTT_HOST: broker
      INFLUX_URL: http://influxdb:8086
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    networks:
      - iot-net

  grafana:
    image: grafana/grafana:11.3.0
    container_name: aiproject-grafana
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      INFLUX_URL: http://influxdb:8086
      # Plugin LLM oficial (feature 002) — version pinneada, no ':latest' (research.md T001)
      GF_INSTALL_PLUGINS: "grafana-llm-app 1.0.8"
      # dashgpt ya viene true por default en 11.3.0 (research.md T001); explicito igual
      # como red de seguridad ante un cambio de default en una version futura.
      GF_FEATURE_TOGGLES_ENABLE: dashgpt
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - influxdb
    networks:
      - iot-net

networks:
  iot-net:
    driver: bridge

volumes:
  influxdb-data:
